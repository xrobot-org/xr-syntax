name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python tools/check_bilingual_docs.py
      - run: python -m ruff format --check src tests tools
      - run: python -m ruff check src tests tools
      - run: python -m mypy src

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --no-deps dist/*.whl
      - name: Verify standalone wheel
        run: |
          python - <<'PY'
          import importlib.metadata

          from xr_syntax.cpp import CppDocument
          from xr_syntax.cmake import CMakeDocument

          cpp = b'#include "a.hpp"\r\nvoid f() { target(1); }\r\n'
          cmake = b'project(Demo)\r\nadd_library(foo STATIC foo.cpp)\r\n'
          assert CppDocument.parse(cpp).render_bytes() == cpp
          assert CMakeDocument.parse(cmake).render_bytes() == cmake

          requirements = importlib.metadata.requires("xr-syntax") or []
          base_requirements = [item for item in requirements if "extra ==" not in item]
          assert not base_requirements, base_requirements
          PY
